name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: travelblog
          POSTGRES_USER: travelblog
          POSTGRES_PASSWORD: travelblog
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U travelblog"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Throwaway values: the database only lives for the length of the job.
      DJANGO_SECRET_KEY: ci-only-not-a-secret
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_DB: travelblog
      POSTGRES_USER: travelblog
      POSTGRES_PASSWORD: travelblog
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.1"
          enable-cache: true
      - run: uv sync --frozen
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format
        run: uv run ruff format --check .
      - name: Django system checks
        run: uv run python manage.py check
      - name: Missing migrations
        run: uv run python manage.py makemigrations --check --dry-run
      - name: Tests with coverage
        run: uv run pytest --cov-report=markdown-append:"$GITHUB_STEP_SUMMARY"

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: ESLint
        run: npm run lint
      - name: Prettier
        run: npm run format:check
      - name: TypeScript
        run: npm run typecheck
      - name: Vitest
        run: npm test
      - name: Build
        run: npm run build
